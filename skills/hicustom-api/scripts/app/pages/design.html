<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Design · HICUSTOM 工作台</title>
<style>
  :root{--bg:#f2f3f5;--card:#fff;--line:#e3e6e6;--ink:#0f1111;--muted:#565959;--brand:#e8590c;--link:#007185}
  *{box-sizing:border-box}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);margin:0;color:var(--ink)}
  header{position:sticky;top:0;background:#131921;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600}header a{color:#cbd5e1;text-decoration:none;font-size:13px}header a:hover{color:#fff}
  .wrap{max-width:1240px;margin:0 auto;padding:20px;display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--muted)}
  .prod{display:flex;gap:12px}
  .prod img{width:104px;height:104px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}
  .kv{font-size:13px;line-height:1.7;min-width:0}
  .kv b{font-weight:600}
  .preview{display:flex;align-items:center;justify-content:center;min-height:300px;border:1px dashed var(--line);border-radius:12px;background:#fafafa;overflow:hidden}
  .preview img{max-width:100%;max-height:440px;display:block;border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:340px;overflow:auto;padding:2px}
  .pitem{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .pitem img{width:100%;height:100%;object-fit:cover}
  .pitem.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(232,89,12,.15)}
  .pname{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;word-break:break-all;line-height:1.2}
  textarea{width:100%;min-height:220px;max-height:72vh;font:inherit;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:10px;resize:none;overflow-y:auto;box-sizing:border-box;transition:height .12s ease}
  button{font:inherit;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:not-allowed}
  pre{background:#0f172a;color:#cbd5e1;border-radius:8px;padding:10px;font-size:11px;max-height:160px;overflow:auto;white-space:pre-wrap;margin:10px 0 0}
  .muted{color:var(--muted);font-size:13px}.err{color:#b91c1c}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:12px;padding:16px;min-width:320px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modal .box h3{margin:0 0 8px;font-size:15px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  code{background:#f4f4f5;padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
  @media(max-width:860px){ .wrap{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>🎨 Design 流程</h1>
  <a href="/">首页</a><a href="/manage.html">管理后台</a><a href="/listing-list.html">Listing 列表</a>
</header>
<div class="wrap">

  <!-- 左栏：商品 + 预览 -->
  <div class="col">
    <div class="card prod" id="prod"><span class="muted">加载商品…</span></div>
    <div class="card">
      <h2>当前图案</h2>
      <div class="preview"><img id="cur" alt="未选择" style="display:none"/></div>
      <div id="curinfo" class="muted" style="margin-top:10px">尚未选择图案。右侧选一张，或 AI 生成。</div>
      <div id="specinfo" class="muted" style="margin-top:6px;line-height:1.7"></div>
      <div class="row" style="margin:10px 0 0">
        <button id="fitbtn" disabled title="裁切/适配到印刷区尺寸">✂️ 适配到印刷区</button>
        <button id="next-stamp" disabled>下一步：叠字</button>
        <button id="next-wf" disabled>下一步：跑 Workflow</button>
      </div>
    </div>
  </div>

  <!-- 右栏：选图 + AI 生成 -->
  <div class="col">
    <div class="card">
      <h2>① 选择图案（patterns/ 图案库 + input/）</h2>
      <div class="row"><button id="rpat">↻ 刷新图案库</button><span id="patcnt" class="muted"></span></div>
      <div class="grid" id="patgrid"></div>
      <div class="row" id="pager" style="margin:10px 0 0;justify-content:center;gap:12px"></div>
    </div>

    <div class="card">
      <h2>② 或用 AI 生成图案（提示词可改）</h2>
      <div class="row"><span id="gsize" class="muted"></span></div>
      <textarea id="prompt" placeholder="AI 提示词…"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="gen">🤖 生成图案</button>
        <button id="rewrite" title="调 AI 基于商品信息重写一版不一样的提示词">✨ 用商品信息重写提示词</button>
        <button id="resetp">↺ 恢复默认</button>
      </div>
      <div class="row" id="errrow" style="display:none;margin-top:0">
        <span class="err" id="errmsg"></span>
        <button id="fixerr" title="按报错提示自动改进提示词">🛠 按报错改进提示词</button>
      </div>
      <pre id="log" style="display:none"></pre>
    </div>
  </div>

</div>
<div class="modal" id="fitdlg"><div class="box">
  <h3>适配模式</h3>
  <div class="muted" id="fitinfo" style="margin-bottom:12px"></div>
  <div class="row" style="margin:0">
    <button class="primary" id="fitcover">cover（裁切填满）</button>
    <button id="fitcontain">contain（留白放入）</button>
    <button id="fitcancel">取消</button>
  </div>
</div></div>
<script>
const $=(id)=>document.getElementById(id);
const Q=new URLSearchParams(location.search); const ID=Q.get('id');
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CUR=null, DEFAULT_PROMPT='', SIZE='', P=null;

async function loadProduct(){
  if(!ID){ $('prod').innerHTML='<span class="err">缺少 ?id=</span>'; return; }
  try{
    const j=await (await fetch('/api/blank-product?id='+encodeURIComponent(ID))).json();
    if(!j.ok) throw new Error(j.err||'fail'); const p=j.product; P=p;
    $('prod').innerHTML=`<img src="${esc(p.image)}" onerror="this.style.visibility='hidden'"/>
      <div class="kv"><div style="font-size:16px;font-weight:700">${esc(p.cnName)}</div>
      <div class="muted">${esc(p.enName)}</div>
      <div><b>ID</b> ${esc(p.id)}</div>
      <div><b>印刷区</b> ${(p.printAreas||[]).map(a=>esc(a.name)+' '+a.width+'×'+a.height).join(' / ')||'—'}</div>
      <div><b>颜色</b> ${(p.colors||[]).join('/')||'—'} · <b>尺码</b> ${(p.sizes||[]).join('/')||'—'}</div>
      <div><b>风格</b> ${esc((p.style&&p.style.recommend_style)||'')} ${esc((p.style&&p.style.theme_element)||'')}</div></div>`;
  }catch(e){ $('prod').innerHTML='<span class="err">商品加载失败: '+esc(e.message)+'</span>'; }
}
async function loadPrompt(){
  try{ const j=await (await fetch('/api/pattern/prompt?id='+encodeURIComponent(ID))).json(); if(!j.ok) throw new Error(j.err); DEFAULT_PROMPT=j.prompt; SIZE=j.size||''; $('gsize').textContent='生成尺寸: '+SIZE; $('prompt').value=j.prompt; autoGrow(); }catch(e){ $('gsize').textContent='提示词加载失败: '+e.message; }
}
// 提示词自动增高：随内容长高、不出现内部滚动条；超高时才滚动（上限 72vh）
function autoGrow(){
  const t=$('prompt'); if(!t) return;
  t.style.height='auto';
  const cap=Math.round(window.innerHeight*0.72);
  t.style.height=Math.min(t.scrollHeight,cap)+'px';
  t.style.overflowY = t.scrollHeight>cap ? 'auto' : 'hidden';
}
$('prompt').addEventListener('input', autoGrow);
window.addEventListener('resize', autoGrow);
// ✨ 唤起 AI 协作：基于商品信息重写一版「不一样」的提示词（走统一网关 /api/ai/run）
$('rewrite').onclick=async()=>{
  const b=$('rewrite'), old=b.textContent;
  b.disabled=true; b.textContent='✨ AI 重写中…';
  try{
    const r=await fetch('/api/ai/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'pattern.prompt.rewrite',payload:{productId:ID,base:$('prompt').value}})});
    const j=await r.json(); if(!j.ok) throw new Error(j.err||'失败');
    $('prompt').value=j.result.prompt||''; autoGrow();
    $('gsize').textContent='生成尺寸: '+SIZE+' · 已换一版方案：'+(j.result.angle||'');
  }catch(e){ alert('重写提示词失败: '+e.message); }
  finally{ b.disabled=false; b.textContent=old; }
};
$('resetp').onclick=()=>{ $('prompt').value=DEFAULT_PROMPT; $('gsize').textContent='生成尺寸: '+SIZE; autoGrow(); };

let PPAGE=1, PSIZE=48, PPAGES=1, PTOTAL=0;
async function loadPatterns(page){
  if(page) PPAGE=page;
  try{
    const j=await (await fetch('/api/patterns?page='+PPAGE+'&size='+PSIZE)).json(); if(!j.ok) throw new Error(j.err);
    PPAGE=j.page||1; PPAGES=j.pages||1; PTOTAL=j.total||0;
    $('patcnt').textContent='共 '+PTOTAL+' 张 · 第 '+PPAGE+'/'+PPAGES+' 页';
    // 网格只加载缩略图（thumb）；点选后用原图（data-url）
    $('patgrid').innerHTML=(j.items||[]).map(x=>`<div><div class="pitem" data-url="${esc(x.url)}" onclick="pick(this)"><img src="${esc(x.thumb||x.url)}" loading="lazy" onerror="this.style.opacity=.2"/></div><div class="pname">${esc(x.name)}</div></div>`).join('') || '<span class="muted">图案库为空（放图到 patterns/，或 AI 生成）</span>';
    renderPager();
  }catch(e){ $('patcnt').textContent='加载失败: '+e.message; }
}
function renderPager(){
  const el=$('pager'); if(!el) return;
  if(PPAGES<=1){ el.innerHTML=''; return; }
  el.innerHTML='<button '+(PPAGE<=1?'disabled':'')+' onclick="gotoPage('+(PPAGE-1)+')">‹ 上一页</button>'
    +'<span class="muted">第 '+PPAGE+' / '+PPAGES+' 页</span>'
    +'<button '+(PPAGE>=PPAGES?'disabled':'')+' onclick="gotoPage('+(PPAGE+1)+')">下一页 ›</button>';
}
window.gotoPage=(n)=>{ if(n>=1&&n<=PPAGES){ loadPatterns(n); const g=$('patgrid'); if(g) g.scrollIntoView({block:'nearest'}); } };
$('rpat').onclick=()=>loadPatterns(1);
window.pick=(el)=>{ document.querySelectorAll('.pitem.sel').forEach(n=>n.classList.remove('sel')); el.classList.add('sel'); setCur(el.getAttribute('data-url'),'选自图案库', false); };

function setCur(url, from, alsoRefreshList){
  CUR=url;
  $('cur').style.display=''; $('cur').src=url; $('cur').onload=updateSpec;
  $('curinfo').innerHTML='当前图案：<code>'+esc(url)+'</code> <span class="muted">（'+esc(from)+'）</span>';
  $('next-stamp').disabled=false; $('next-wf').disabled=false;
  if(alsoRefreshList) loadPatterns();
  updateSpec();
}

// —— 尺寸对比 + 适配评估（被选图案下方显示）——
function pa0(){ return (P && P.printAreas && P.printAreas[0]) || null; }
function updateSpec(){
  const img=$('cur'), pa=pa0();
  const fit=$('fitbtn'); if(fit) fit.disabled=true;
  if(!CUR){ $('specinfo').innerHTML=''; return; }
  if(!pa){ $('specinfo').innerHTML='<span class="muted">该商品未取到印刷区尺寸，无法比对。</span>'; return; }
  const iw=img.naturalWidth, ih=img.naturalHeight;
  if(!iw||!ih){ $('specinfo').textContent='图案尺寸读取中…'; return; }
  const pw=pa.width, ph=pa.height, rI=iw/ih, rP=pw/ph, ra=Math.abs(rI-rP)/rP;
  const coverSc=Math.max(pw/iw, ph/ih);
  const cropFrac=Math.max(0, 1 - (pw*ph)/((iw*coverSc)*(ih*coverSc)));
  const containSc=Math.min(pw/iw, ph/ih);
  const padFrac=Math.max(0, 1 - (iw*containSc*ih*containSc)/(pw*ph));
  const match=ra<0.03;
  const parts=[];
  parts.push('图案 <b>'+iw+'×'+ih+'</b>（'+(rI).toFixed(2)+':1）');
  parts.push('印刷区 <b>'+pw+'×'+ph+'</b>（'+(rP).toFixed(2)+':1）'+(pa.name?(' · '+esc(pa.name)):''));
  parts.push(match? '<span style="color:#128a3f">✅ 比例吻合</span>' : ('⚠️ 比例差 '+Math.round(ra*100)+'%'));
  parts.push('cover → 裁掉约 '+Math.round(cropFrac*100)+'%');
  parts.push('contain → 留白约 '+Math.round(padFrac*100)+'%');
  parts.push(coverSc>1.02 ? ('<span class="err">⚠️ 图案偏小，会放大到 '+Math.round(coverSc*100)+'%（可能模糊）</span>') : '<span style="color:#128a3f">✅ 分辨率足够</span>');
  $('specinfo').innerHTML=parts.join(' ｜ ');
  if(fit){ fit.disabled=false; fit.textContent='✂️ 适配到印刷区 '+pw+'×'+ph; }
}

// —— 适配按钮：弹选择 cover/contain → 出适格图 → 替换当前图案 ——
$('fitbtn').onclick=()=>{
  const pa=pa0(); if(!CUR||!pa) return;
  $('fitinfo').innerHTML='目标：<b>'+pa.width+'×'+pa.height+'</b>'+(pa.name?('（'+esc(pa.name)+'）'):'')+' ↔ 图案 '+$('cur').naturalWidth+'×'+$('cur').naturalHeight+' — 选一个适配方式：';
  $('fitdlg').classList.add('show');
};
async function doFit(mode){
  $('fitdlg').classList.remove('show');
  const pa=pa0(); if(!CUR||!pa) return;
  const b=$('fitbtn'); b.disabled=true; const o=b.textContent; b.textContent='适配中…';
  try{
    const r=await fetch('/api/image/fit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ productId:ID, src:CUR, targetW:pa.width, targetH:pa.height, fit:mode })});
    const j=await r.json(); if(!j.ok) throw new Error(j.err);
    setCur(j.url, '适配('+mode+') '+j.w+'×'+j.h, true);
  }catch(e){ alert('适配失败: '+e.message); b.disabled=false; b.textContent=o; }
}
$('fitcover').onclick=()=>doFit('cover');
$('fitcontain').onclick=()=>doFit('contain');
$('fitcancel').onclick=()=>$('fitdlg').classList.remove('show');

let logLines=[], LAST_ERR='';
function showLog(s){ $('log').style.display=''; $('log').textContent=s; }
function showErr(err){ LAST_ERR=err||''; $('errmsg').textContent='生成失败: '+LAST_ERR; $('errrow').style.display=''; }
$('gen').onclick=async()=>{
  if(!ID){ alert('缺少商品 id'); return; }
  $('errrow').style.display='none';
  $('gen').disabled=true; logLines=['提交中…']; showLog(logLines.join('\n'));
  try{
    const r=await fetch('/api/pattern/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:ID,prompt:$('prompt').value})});
    const j=await r.json(); if(!j.ok) throw new Error(j.err||'提交失败');
    await pollJob(j.jobId);
  }catch(e){ logLines.push('失败: '+e.message); showLog(logLines.join('\n')); showErr(e.message); } finally { $('gen').disabled=false; }
};
$('fixerr').onclick=async()=>{
  const b=$('fixerr'), old=b.textContent; b.disabled=true; b.textContent='🛠 改进中…';
  try{
    const r=await fetch('/api/ai/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'pattern.prompt.fix',payload:{productId:ID,prompt:$('prompt').value,error:LAST_ERR}})});
    const j=await r.json(); if(!j.ok) throw new Error(j.err||'失败');
    if(j.result.prompt){ $('prompt').value=j.result.prompt; autoGrow(); }
    $('errmsg').textContent='已按报错处理：'+(j.result.note||'');
  }catch(e){ $('errmsg').textContent='改进失败: '+e.message; }
  finally{ b.disabled=false; b.textContent=old; }
};
async function pollJob(id){
  for(let i=0;i<160;i++){
    const j=await (await fetch('/api/flow/status?id='+encodeURIComponent(id))).json();
    if(!j.ok) throw new Error(j.err);
    const job=j.job; showLog('状态: '+job.status+'\n'+(job.log||[]).join('\n'));
    if(job.status==='done'){ setCur(job.result.url,'AI 生成', true); break; }   // ← 出图 → 左栏刷新显示
    if(job.status==='error'){ const em=((job.result&&job.result.err)||'生成失败'); logLines.push('出错: '+em); showLog(logLines.join('\n')); showErr(em); break; }
    await new Promise(r=>setTimeout(r,1500));
  }
}
$('next-stamp').onclick=()=>{ if(!CUR){ alert('请先在左侧选择或生成图案'); return; } location.href='/stamp.html?id='+encodeURIComponent(ID)+'&src='+encodeURIComponent(CUR); };
$('next-wf').onclick=()=>alert('Workflow 按钮将在下一阶段接上。\n当前图案: '+CUR);
loadProduct(); loadPrompt(); loadPatterns();
</script>
<script src="/ai-edit.js"></script>
</body>
</html>
