<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HICUSTOM 工作台</title>
<style>
  :root{--bg:#f2f3f5;--card:#fff;--line:#e3e6e6;--ink:#0f1111;--muted:#565959;--brand:#e8590c;--link:#007185}
  *{box-sizing:border-box}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);margin:0;color:var(--ink)}
  header{position:sticky;top:0;background:#131921;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600}
  header a{color:#cbd5e1;text-decoration:none;font-size:13px}header a:hover{color:#fff}
  .wrap{max-width:1320px;margin:0 auto;padding:20px}
  .entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:22px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:inherit;display:block;transition:.15s}
  .entry:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .entry .t{font-weight:700;font-size:15px}.entry .d{color:var(--muted);font-size:12px;margin-top:4px}
  .sec-title{font-size:15px;font-weight:700;margin:8px 0 12px;display:flex;align-items:center;gap:10px}
  .tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.06);transform:translateY(-1px)}
  .thumb{width:100%;aspect-ratio:1/1;background:#fafafa;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
  .badge{position:absolute;top:6px;left:6px;font-size:11px;line-height:1;padding:3px 7px;border-radius:20px;z-index:2;border:1px solid transparent}
  .badge.ok{background:#e8fff3;border-color:#b7eb8f;color:#128a3f}
  .badge.draft{background:#fff7e6;border-color:#ffd591;color:#ad6800}
  .card.done{border-color:#b7eb8f;background:#fbfffd}
  .go.ok{background:#128a3f}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .thumb .ph{color:#c4c4c4;font-size:24px}
  .card .name{font-size:13px;font-weight:600;margin:6px 0 1px;line-height:1.3}
  .card .en{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
  .foot .id{font-size:11px;color:var(--muted)}
  .go{font-size:11px;color:#fff;background:var(--brand);border-radius:6px;padding:3px 8px;text-decoration:none;white-space:nowrap}
  .go:hover{opacity:.9}
  .go.alt{background:#fff;color:var(--link);border:1px solid var(--line)}
  .foot .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0 4px;flex-wrap:wrap}
  button{font:inherit;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .muted{color:var(--muted);font-size:13px}.err{color:#b91c1c}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .lb.show{display:flex}
  .lbinner{background:#fff;border-radius:14px;max-width:min(92vw,900px);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .lbinner img{max-width:100%;max-height:70vh;object-fit:contain;background:#fafafa;display:block}
  .lbbar{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .lbbar .nm{font-weight:600;flex:1;min-width:160px}
  .lbbar a.btn{text-decoration:none}
  @media(max-width:800px){ .wrap{padding:12px} }
</style>
</head>
<body>
<header>
  <h1>🦞 HICUSTOM 工作台</h1>
  <a href="/">首页</a>
  <a href="/manage.html" target="_blank" rel="noopener">管理后台</a>
  <a href="/listing-list.html" target="_blank" rel="noopener">Listing 列表</a>
  <a href="/workflow.html" target="_blank" rel="noopener">Workflow</a>
</header>

<div class="wrap">
  <div class="entries">
    <a class="entry" href="/manage.html" target="_blank" rel="noopener"><div class="t">📊 管理后台</div><div class="d">CSV 数据库商品列表 / 详情 / 编辑</div></a>
    <a class="entry" href="/listing-list.html" target="_blank" rel="noopener"><div class="t">📦 Listing 列表</div><div class="d">跑过上架流程的商品（预览 / 状态）</div></a>
    <a class="entry" href="/workflow.html" target="_blank" rel="noopener"><div class="t">▶️ Workflow 工作台</div><div class="d">取成品跑 workflow（异步队列）</div></a>
  </div>

  <div class="sec-title">🆕 指纹上新 <span class="muted" id="cnt"></span></div>
  <div class="tools">
    <input id="q" placeholder="按名称过滤本页…" style="min-width:220px"/>
    <label class="muted">每页</label>
    <select id="size"><option>20</option><option selected>30</option><option>60</option><option>100</option></select>
    <button id="refresh">↻ 刷新</button>
  </div>
  <div id="list" class="grid"></div>
  <div class="pager">
    <button id="first">« 首页</button>
    <button id="prev">‹ 上一页</button>
    <span id="page" class="muted"></span>
    <button id="next">下一页 ›</button>
    <button id="last">末页 »</button>
  </div>
  <div id="msg" class="muted"></div>
</div>

<div class="lb" id="lb">
  <div class="lbinner">
    <img id="lbimg" alt=""/>
    <div class="lbbar">
      <span class="nm" id="lbname"></span>
      <a id="lbhicustom" href="#" target="_blank" rel="noopener"><button>🔗 指纹详情</button></a>
      <a id="lbhicom" href="#" target="_blank" rel="noopener"><button>⚙️ 指纹后台</button></a>
      <a id="lbdesign" href="#" target="_blank" rel="noopener"><button class="primary">🎨 去 design</button></a>
      <button id="lbclose">关闭</button>
    </div>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={ page:1, size:30, lastPage:1, total:0, items:[], filter:'' };

async function load(page){
  $('msg').textContent='加载中…'; $('msg').className='muted';
  try{
    const r=await fetch('/api/blank-products?page='+page+'&size='+S.size);
    const j=await r.json(); if(!j.ok) throw new Error(j.err||'加载失败');
    S.page=j.page; S.lastPage=j.lastPage; S.total=j.total; S.items=j.items||[];
    render(); $('msg').textContent='';
  }catch(e){ $('msg').textContent='加载失败: '+e.message; $('msg').className='err'; }
}

function view(){ const f=S.filter.trim().toLowerCase(); return f? S.items.filter(x=>((x.cnName||'')+(x.enName||'')).toLowerCase().includes(f)) : S.items; }

function render(){
  const list=view().slice().sort((a,b)=>(a.designed?1:0)-(b.designed?1:0));   // 已设计排后面
  $('cnt').textContent='共 '+S.total+' 条（ID 降序，已设计置后）'+(S.filter?(' · 本页过滤 '+list.length):'')+' · 第 '+S.page+'/'+S.lastPage+' 页';
  $('page').textContent='第 '+S.page+' / '+S.lastPage+' 页';
  $('prev').disabled=$('first').disabled = S.page<=1;
  $('next').disabled=$('last').disabled = S.page>=S.lastPage;
  $('list').innerHTML = list.length? list.map(x=>{
    const badge = x.designed ? ('<span class="badge '+(x.status==='draft'?'draft':'ok')+'">'+(x.status==='draft'?'🧪 试跑':'✅ 已设计')+'</span>') : '';
    const prodBtn = x.designed ? ('<a class="go ok" href="/product.html?id='+x.id+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📄 product.html</a>') : '';
    return `
    <div class="card ${x.designed?'done':''}" data-id="${x.id}" data-name="${esc(x.cnName)}">
      <div class="thumb">${badge}<span class="ph">🖼</span><img data-id="${x.id}" alt="" style="display:none"/></div>
      <div class="name">${esc(x.cnName)}</div>
      <div class="en">${esc(x.enName)}</div>
      <div class="foot"><span class="id">#${x.id}</span><span class="btns">${prodBtn}<a class="go alt" href="https://www.hicustom.com/productType/item/${x.id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 指纹详情</a><a class="go alt" href="https://www.hicustom.com/merchant/productType/edit?type=0&cat_id=&id=${x.id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">⚙️ 指纹后台</a><a class="go" href="/design.html?id=${x.id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🎨 去 design</a></span></div>
    </div>`;
  }).join('') : '<div class="muted">无匹配</div>';
  setupLazy();
}

// —— 图片懒加载 + 并发限流（观察可见的 .thumb，而非隐藏的 img）——
const MQ=[]; let MACT=0; const MMAX=5;
function enqueueImg(id, imgEl, thumbEl){ MQ.push({id,imgEl,thumbEl}); pumpImg(); }
function pumpImg(){
  while(MACT<MMAX && MQ.length){
    const t=MQ.shift(); MACT++;
    fetch('/api/blank-product?id='+encodeURIComponent(t.id)).then(r=>r.json()).then(j=>{
      const url=j.ok && j.product && j.product.image;
      if(url){ t.imgEl.src=url; t.imgEl.style.display=''; const ph=t.thumbEl&&t.thumbEl.querySelector('.ph'); if(ph) ph.style.display='none'; }
    }).catch(()=>{}).finally(()=>{ MACT--; pumpImg(); });
  }
}
let io=null;
function setupLazy(){
  io = io || new IntersectionObserver((es)=>{ es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); const img=e.target.querySelector('img[data-id]'); if(img) enqueueImg(img.getAttribute('data-id'), img, e.target); } }); }, { rootMargin:'240px' });
  document.querySelectorAll('.thumb').forEach(el=>io.observe(el));
}

// —— 点击放大看图 ——
$('list').addEventListener('click',(e)=>{
  if(e.target.closest && e.target.closest('.go')) return;          // 去 design 按钮不触发放大
  const card=e.target.closest&&e.target.closest('.card'); if(!card) return;
  const id=card.getAttribute('data-id'), name=card.getAttribute('data-name')||'';
  const img=card.querySelector('.thumb img');
  $('lbname').textContent = name + '  #' + id;
  $('lbdesign').setAttribute('href','/design.html?id='+encodeURIComponent(id));
  $('lbhicustom').setAttribute('href','https://www.hicustom.com/productType/item/'+encodeURIComponent(id));
  $('lbhicom').setAttribute('href','https://www.hicustom.com/merchant/productType/edit?type=0&cat_id=&id='+encodeURIComponent(id));
  const show=(url)=>{ $('lbimg').src=url; $('lb').classList.add('show'); };
  if(img && img.src && img.style.display!=='none'){ show(img.src); }
  else { $('msg').textContent='取图中…'; fetch('/api/blank-product?id='+encodeURIComponent(id)).then(r=>r.json()).then(j=>{ show((j.ok&&j.product&&j.product.image)||''); }).catch(()=>{}).finally(()=>{ $('msg').textContent=''; }); }
});
$('lbclose').onclick=()=>$('lb').classList.remove('show');
$('lb').addEventListener('click',(e)=>{ if(e.target===$('lb')) $('lb').classList.remove('show'); });

$('first').onclick=()=>load(1);
$('prev').onclick=()=>load(S.page-1);
$('next').onclick=()=>load(S.page+1);
$('last').onclick=()=>load(S.lastPage);
$('refresh').onclick=()=>load(S.page);
$('size').onchange=(e)=>{ S.size=Number(e.target.value); load(1); };
$('q').oninput=(e)=>{ S.filter=e.target.value; render(); };
load(1);
</script>
</body>
</html>
