<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HICUSTOM 工作台</title>
<style>
  :root{--bg:#f2f3f5;--card:#fff;--line:#e3e6e6;--ink:#0f1111;--muted:#565959;--brand:#e8590c;--link:#007185}
  *{box-sizing:border-box}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);margin:0;color:var(--ink)}
  header{position:sticky;top:0;background:#131921;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;z-index:5}
  header h1{font-size:16px;margin:0;font-weight:600}
  header a{color:#cbd5e1;text-decoration:none;font-size:13px}
  header a:hover{color:#fff}
  header .sp{margin-left:auto}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  .entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:22px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:inherit;display:block;transition:.15s}
  .entry:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .entry .t{font-weight:700;font-size:15px}.entry .d{color:var(--muted);font-size:12px;margin-top:4px}
  .sec-title{font-size:15px;font-weight:700;margin:8px 0 12px;display:flex;align-items:center;gap:10px}
  .tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.06);transform:translateY(-1px)}
  .card .id{font-size:11px;color:var(--muted)}
  .card .name{font-size:14px;font-weight:600;margin:4px 0 2px;line-height:1.35;min-height:38px}
  .card .en{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .go{margin-top:8px;font-size:12px;color:var(--link)}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0 4px}
  button{font:inherit;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--brand)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .muted{color:var(--muted);font-size:13px}
  .err{color:#b91c1c}
</style>
</head>
<body>
<header>
  <h1>🦞 HICUSTOM 工作台</h1>
  <a href="/">首页</a>
  <a href="/manage.html">管理后台</a>
  <a href="/listing-list.html">Listing 列表</a>
  <span class="sp"></span>
</header>

<div class="wrap">
  <div class="entries">
    <a class="entry" href="/manage.html"><div class="t">📊 管理后台</div><div class="d">CSV 数据库商品列表 / 详情 / 编辑</div></a>
    <a class="entry" href="/listing-list.html"><div class="t">📦 Listing 列表</div><div class="d">跑过上架流程的商品（预览 / 状态）</div></a>
  </div>

  <div class="sec-title">🆕 指纹上新 <span class="muted" id="cnt"></span></div>
  <div class="tools">
    <input id="q" placeholder="按名称过滤本页…" style="min-width:240px"/>
    <button id="refresh">↻ 刷新</button>
  </div>
  <div id="list" class="grid"></div>
  <div class="pager">
    <button id="prev">‹ 上一页</button>
    <span id="page" class="muted"></span>
    <button id="next">下一页 ›</button>
  </div>
  <div id="msg" class="muted"></div>
</div>

<script>
const $ = (id)=>document.getElementById(id);
let state = { page:1, size:60, lastPage:1, items:[], filter:'' };

async function load(page){
  $('msg').textContent = '加载中…'; $('msg').className='muted';
  try{
    const r = await fetch('/api/blank-products?page='+page+'&size='+state.size);
    const j = await r.json();
    if(!j.ok) throw new Error(j.err||'加载失败');
    state.page = j.page; state.lastPage = j.lastPage; state.items = j.items||[];
    render();
    $('msg').textContent = '';
  }catch(e){ $('msg').textContent = '加载失败: '+e.message; $('msg').className='err'; }
}

function view(){ const f=state.filter.trim().toLowerCase(); return f? state.items.filter(x=>((x.cnName||'')+(x.enName||'')).toLowerCase().includes(f)) : state.items; }

function render(){
  const list = view();
  $('cnt').textContent = '共 '+state.items.length+' 条（ID 降序）' + (state.filter?(' · 过滤后 '+list.length):'');
  $('page').textContent = '第 '+state.page+' / '+state.lastPage+' 页';
  $('prev').disabled = state.page<=1; $('next').disabled = state.page>=state.lastPage;
  $('list').innerHTML = list.length ? list.map(x=>`
    <div class="card" onclick="location.href='/design.html?id=${x.id}'">
      <div class="id">#${x.id}</div>
      <div class="name">${esc(x.cnName)}</div>
      <div class="en">${esc(x.enName)}</div>
      <div class="go">进入 design →</div>
    </div>`).join('') : '<div class="muted">无匹配</div>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('prev').onclick = ()=> load(state.page-1);
$('next').onclick = ()=> load(state.page+1);
$('refresh').onclick = ()=> load(1);
$('q').oninput = (e)=>{ state.filter = e.target.value; render(); };
load(1);
</script>
</body>
</html>
